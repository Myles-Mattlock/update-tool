name: Build and Package Multiple PowerShell Scripts and Create Release

on:
  push:
    branches:
      - dev
      - main
    tags:
      - 'v*.*.*' # Trigger on tags like v1.0.0
  workflow_dispatch:

jobs:
  system_update_build:
    name: Build System update
    runs-on: windows-2022 # Using 'windows-2022' as 'windows-2025' is a placeholder

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache PowerShell Modules (update)
      uses: actions/cache@v4
      id: cache-psmodules-system
      with:
        path: ~\Documents\WindowsPowerShell\Modules
        key: ${{ runner.os }}-psmodules-system-${{ hashFiles('**/requirements.psd1') }} # Adjust pattern as needed

    - name: Install ps2exe module (update)
      if: steps.cache-psmodules-system.outputs.cache-hit != 'true'
      run: |
        pwsh -Command "Install-Module -Name ps2exe -Force"
      shell: pwsh

    - name: Cache Build Tools (update)
      uses: actions/cache@v4
      id: cache-buildtools-system
      with:
        path: C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools
        key: ${{ runner.os }}-buildtools-system-2022 # Consider a more dynamic key if needed

    - name: Install Visual Studio Build Tools (update)
      if: steps.cache-buildtools-system.outputs.cache-hit != 'true'
      run: |
        # Remove the file if it exists
        if (Test-Path "BuildTools_Full.exe") {
          Remove-Item "BuildTools_Full.exe"
        }
        try {
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?LinkId=2084274" -OutFile "BuildTools_Full.exe" -ErrorAction Stop
          Write-Host "BuildTools_Full.exe downloaded successfully."
          Start-Process -Wait -FilePath "BuildTools_Full.exe" -ArgumentList "/Quiet", "/InstallSelectableItems", "Microsoft.DesktopBuildTools" -ErrorAction Stop
          Write-Host "Build Tools installed successfully (Direct Download)."
        } catch {
          Write-Warning "Direct download of Build Tools failed: $($_.Exception.Message). Attempting installation via choco..."
          choco install visualstudio2022buildtools -y --package-parameters "--add Microsoft.Component.MSBuild --add Microsoft.Component.VC"
          Write-Host "Build Tools installed successfully (via choco)."
        }
      shell: pwsh

    - name: Set Environment Path (update)
      run: |
        $env:PATH += ";C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Tools\MSVC\*\bin\Hostx64\x64"
      shell: pwsh

    - name: Convert PowerShell script to executable (update)
      run: |
        # 🟢 FIX 1: Create the executable with a temporary name (no spaces)
        pwsh -Command "ps2exe -InputFile update.ps1 -OutputFile 'SystemUpdate/TempUpdate.exe' -IconFile Refresh.ico -version '1.0'"
      shell: pwsh

    - name: Run mt.exe to embed manifest (update)
      run: |
        $mtPath = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\mt.exe"
        if (-not (Test-Path $mtPath)) {
          $mtPath = Get-ChildItem "C:\Program Files (x86)\Windows Kits\*\bin\*\x64\mt.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 | Select-Object -ExpandProperty FullName
          if (-not $mtPath) {
            Write-Error "mt.exe not found."
            exit 1
          }
        }
        # 🟢 FIX 2: Run mt.exe against the temporary name (no spaces)
        & $mtPath -manifest elevate.manifest.xml -outputresource:"SystemUpdate\TempUpdate.exe";#1
      shell: pwsh

    - name: Rename executable for final packaging
      run: |
        # 🟢 FIX 3: Rename the file back to the desired name (with spaces)
        Rename-Item -Path "SystemUpdate\TempUpdate.exe" -NewName "System Update.exe" -Force
      shell: pwsh

    - name: Create update ZIP
      run: |
        # Use the final, desired name with the space (which PowerShell handles correctly)
        Compress-Archive -Path "SystemUpdate\System Update.exe" -DestinationPath "SystemUpdate/SystemUpdate.zip"
      shell: pwsh

    - name: Upload Artifact (update)
      uses: actions/upload-artifact@v4
      with:
        name: SystemUpdateZIP
        path: SystemUpdate/SystemUpdate.zip

  create_release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [system_update_build]
    if: github.ref_type == 'tag'
    permissions:
      contents: write

    steps:
    - name: Download System update ZIP Artifact
      uses: actions/download-artifact@v4
      with:
        name: SystemUpdateZIP

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        files: |
          SystemUpdate.zip
        draft: false
        prerelease: ${{ contains(github.ref_name, '-') }}