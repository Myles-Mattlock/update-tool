name: Build and Package Multiple PowerShell Scripts and Create Release

on:
  push:
    branches:
      - dev
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build_all:
    name: Build System and Server Versions
    runs-on: windows-2025-vs2026

    steps:
    - name: Checkout code
      uses: actions/checkout@v6.0.2

    - name: Install ps2exe
      run: pwsh -Command "Install-Module -Name ps2exe -Force"
      shell: pwsh

    - name: Install Build Tools (mt.exe)
      run: choco install visualstudio2026buildtools -y --package-parameters "--add Microsoft.Component.MSBuild --add Microsoft.Component.VC"
      shell: pwsh

    - name: Convert PowerShell script to executable (Installer)
      run: |
        ps2exe -InputFile setup.ps1 -OutputFile 'SystemUpdate\setup.exe' -IconFile update-icon.ico -version '2.0.0'
      shell: pwsh

    - name: Run mt.exe to embed manifest (Installer)
      run: |
        # Find mt.exe dynamically in the Windows Kits folder
        $mtPath = Get-ChildItem "C:\Program Files (x86)\Windows Kits\*\bin\*\x64\mt.exe" | Select-Object -ExpandProperty FullName -First 1
        if (-not $mtPath) { throw "mt.exe not found" }
        & $mtPath -manifest elevate.manifest.xml -outputresource:"SystemUpdate\setup.exe";#1
      shell: pwsh

    - name: Convert PowerShell script to executable (System Update)
      run: |
        ps2exe -InputFile update.ps1 -OutputFile 'SystemUpdate\System Update.exe' -IconFile update-icon.ico -version '2.0.0'
      shell: pwsh

    - name: Run mt.exe to embed manifest (System Update)
      run: |
        $mtPath = Get-ChildItem "C:\Program Files (x86)\Windows Kits\*\bin\*\x64\mt.exe" | Select-Object -ExpandProperty FullName -First 1
        & $mtPath -manifest elevate.manifest.xml -outputresource:"SystemUpdate\System Update.exe";#1
      shell: pwsh

    - name: Prepare ZIP layout
      run: |
        New-Item -ItemType Directory -Force -Path ZipStage\SystemUpdate
        Copy-Item "SystemUpdate\setup.exe" "ZipStage\setup.exe"
        Copy-Item "SystemUpdate\System Update.exe" "ZipStage\SystemUpdate\System Update.exe"
      shell: pwsh

    - name: Create System Update ZIP
      run: |
        Compress-Archive -Path "ZipStage\*" -DestinationPath "SystemUpdate.zip"
      shell: pwsh

    - name: Upload Artifact (System Update ZIP)
      uses: actions/upload-artifact@v7.0.1
      with:
        name: SystemUpdateZIP
        path: SystemUpdate.zip

  create_release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [system_Update_build]
    if: github.ref_type == 'tag'
    permissions:
      contents: write

    steps:
    - name: Download System Update ZIP Artifact
      uses: actions/download-artifact@v8.0.1
      with:
        name: SystemUpdateZIP

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        files: SystemUpdate.zip
        draft: false
        prerelease: ${{ contains(github.ref_name, '-') }}