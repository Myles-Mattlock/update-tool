name: Build and Package Multiple PowerShell Scripts and Create Release

on:
  push:
    branches:
      - dev
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  system_Update_build:
    name: Build System Upgrade
    runs-on: windows-2025

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # -------------------------------
    # Cache PowerShell Modules
    # -------------------------------
    - name: Cache PowerShell Modules (System Upgrade)
      uses: actions/cache@v4
      id: cache-psmodules-system
      with:
        path: ~\Documents\WindowsPowerShell\Modules
        key: ${{ runner.os }}-psmodules-system-${{ hashFiles('**/requirements.psd1') }}

    - name: Install ps2exe module (System Upgrade)
      if: steps.cache-psmodules-system.outputs.cache-hit != 'true'
      run: |
        Install-Module -Name ps2exe -Force -Scope CurrentUser
      shell: pwsh

    # -------------------------------
    # Prepare Output Directory
    # -------------------------------
    - name: Create output directory (System Upgrade)
      run: |
        New-Item -ItemType Directory -Force -Path SystemUpdate
      shell: pwsh

    # -------------------------------
    # Convert PowerShell to EXE
    # -------------------------------
    - name: Convert PowerShell script to executable (System Upgrade)
      run: |
        ps2exe `
          -InputFile update.ps1 `
          -OutputFile "SystemUpdate\System Upgrade.exe" `
          -IconFile Refresh.ico `
          -version "1.0"
      shell: pwsh

    # -------------------------------
    # Embed Manifest (mt.exe)
    # -------------------------------
    - name: Embed manifest with mt.exe (System Upgrade)
      run: |
        $exePath = Resolve-Path "SystemUpdate\System Upgrade.exe"

        if (-not (Test-Path $exePath)) {
          Write-Error "EXE not found: $exePath"
          exit 1
        }

        $mtPath = Get-ChildItem "C:\Program Files (x86)\Windows Kits" -Recurse -Filter mt.exe -ErrorAction SilentlyContinue |
                  Select-Object -First 1 -ExpandProperty FullName

        if (-not $mtPath) {
          Write-Error "mt.exe not found."
          exit 1
        }

        & "$mtPath" `
          -manifest elevate.manifest.xml `
          "-outputresource:$exePath;#1"
      shell: pwsh

    # -------------------------------
    # Package ZIP
    # -------------------------------
    - name: Create System Upgrade ZIP
      run: |
        Compress-Archive `
          -Path "SystemUpdate\System Upgrade.exe" `
          -DestinationPath "SystemUpdate\SystemUpdate.zip" `
          -Force
      shell: pwsh

    # -------------------------------
    # Upload Artifact
    # -------------------------------
    - name: Upload Artifact (System Upgrade ZIP)
      uses: actions/upload-artifact@v4
      with:
        name: SystemUpdateZIP
        path: SystemUpdate/SystemUpdate.zip
