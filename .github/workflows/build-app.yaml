name: Build and Package Multiple PowerShell Scripts and Create Release

on:
  push:
    branches:
      - dev
      - main
    tags:
      - 'v*.*.*' # Trigger on tags like v1.0.0
  workflow_dispatch:

jobs:
  system_Update_build:
    name: Build System Update
    runs-on: windows-2025

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache PowerShell Modules (System Update)
      uses: actions/cache@v4
      id: cache-psmodules-system
      with:
        path: ~\Documents\WindowsPowerShell\Modules
        key: ${{ runner.os }}-psmodules-system-${{ hashFiles('**/requirements.psd1') }} # Adjust pattern as needed

    - name: Install ps2exe module (System Update)
      if: steps.cache-psmodules-system.outputs.cache-hit != 'true'
      run: |
        pwsh -Command "Install-Module -Name ps2exe -Force"
      shell: pwsh

    - name: Cache Build Tools (System Update)
      uses: actions/cache@v4
      id: cache-buildtools-system
      with:
        path: C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools
        key: ${{ runner.os }}-buildtools-system-2022 # Consider a more dynamic key if needed

    - name: Set Environment Path (System Update)
      run: |
        $env:PATH += ";C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Tools\MSVC\*\bin\Hostx64\x64"
      shell: pwsh

    - name: Convert PowerShell script to executable (System Update)
      run: |
        pwsh -Command "ps2exe -InputFile installer.ps1 -OutputFile 'SystemUpdate/installer.exe' -version '1.0'"
      shell: pwsh

    - name: Run mt.exe to embed manifest (Install)
      run: |
        $mtPath = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\mt.exe"
        if (-not (Test-Path $mtPath)) {
          $mtPath = Get-ChildItem "C:\Program Files (x86)\Windows Kits\*\bin\*\x64\mt.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 | Select-Object -ExpandProperty FullName
          if (-not $mtPath) {
            Write-Error "mt.exe not found."
            exit 1
          }
        }
        & $mtPath -manifest elevate.manifest.xml -outputresource:"SystemUpdate\installer.exe";#1
      shell: pwsh
    
    - name: Convert PowerShell script to executable (System Update)
      run: |
        pwsh -Command "ps2exe -InputFile update.ps1 -OutputFile 'SystemUpdate/SystemUpdate/System Update.exe' -version '1.0'"
      shell: pwsh

    - name: Run mt.exe to embed manifest (System Update)
      run: |
        $mtPath = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\mt.exe"
        if (-not (Test-Path $mtPath)) {
          $mtPath = Get-ChildItem "C:\Program Files (x86)\Windows Kits\*\bin\*\x64\mt.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 | Select-Object -ExpandProperty FullName
          if (-not $mtPath) {
            Write-Error "mt.exe not found."
            exit 1
          }
        }
        & $mtPath -manifest elevate.manifest.xml -outputresource:"SystemUpdate\SystemUpdate\System Update.exe";#1
      shell: pwsh

    - name: Create System Update ZIP
      run: |
        Compress-Archive -Path "SystemUpdate\installer.exe", "SystemUpdate\SystemUpdate" -DestinationPath "SystemUpdate/SystemUpdate.zip"
      shell: pwsh

    - name: Upload Artifact (Server CleanUp ZIP)
      uses: actions/upload-artifact@v4
      with:
        name: SystemUpdateZIP
        path: SystemUpdate/SystemUpdate.zip      

  create_release:
      name: Create Release
      runs-on: ubuntu-latest
      needs: [system_Update_build]
      if: github.ref_type == 'tag'
      permissions:
        contents: write

      steps:
      - name: Download System Update ZIP Artifact
        uses: actions/download-artifact@v4
        with:
          name: SystemUpdateZIP

      - name: Download System Update ZIP Artifact
        uses: actions/download-artifact@v4
        with:
          name: SystemUpdateZIP

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            SystemUpdate.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}