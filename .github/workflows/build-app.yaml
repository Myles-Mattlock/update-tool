name: Build and Package Multiple PowerShell Scripts and Create Release

on:
  push:
    branches:
      - dev
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  system_Update_build:
    name: Build System Update
    runs-on: windows-2025-vs2026

    steps:
    - name: Checkout code
      uses: actions/checkout@v6.0.2

    - name: Install ps2exe module
      run: |
        Install-Module -Name ps2exe -Force -Scope CurrentUser
      shell: pwsh

    - name: Prepare Staging and Build Executables
      run: |
        # Create staging directory structure
        New-Item -ItemType Directory -Force -Path "ZipStage\SystemUpdate"
        
        # Compile Installer
        ps2exe -InputFile setup.ps1 -OutputFile 'ZipStage\setup.exe' -IconFile update-icon.ico -version '2.0.0'
        
        # Compile System Update Tool
        ps2exe -InputFile update.ps1 -OutputFile 'ZipStage\SystemUpdate\System Update.exe' -IconFile update-icon.ico -version '2.0.0'
      shell: pwsh

    - name: Embed Admin Manifests (mt.exe)
      run: |
        # Find mt.exe dynamically (CleanUp Suite Logic)
        $mtPath = Get-ChildItem "C:\Program Files (x86)\Windows Kits\*\bin\*\x64\mt.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
        if (-not $mtPath) { throw "mt.exe not found" }
        
        # Apply manifests to the staged executables
        & $mtPath -manifest elevate.manifest.xml -outputresource:"ZipStage\setup.exe";#1
        & $mtPath -manifest elevate.manifest.xml -outputresource:"ZipStage\SystemUpdate\System Update.exe";#1
      shell: pwsh

    - name: Create System Update ZIP
      run: |
        Compress-Archive -Path "ZipStage\*" -DestinationPath "SystemUpdate.zip"
      shell: pwsh

    - name: Upload Artifact
      uses: actions/upload-artifact@v7.0.1
      with:
        name: SystemUpdate-Package
        path: SystemUpdate.zip

  create_release:
    name: Create Release
    needs: system_Update_build
    # Logic from CleanUp Suite: Allow release on tags OR main branch
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download Artifact
      uses: actions/download-artifact@v8.0.1
      with:
        name: SystemUpdate-Package

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        # If it's a tag, use the tag name. If it's main branch, name it 'beta-latest'
        tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'beta-latest' }}
        files: SystemUpdate.zip
        draft: false
        # Mark as prerelease if it's the main branch or the tag contains a hyphen (e.g., v1.0.0-beta)
        prerelease: ${{ github.ref == 'refs/heads/main' || contains(github.ref_name, '-') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}